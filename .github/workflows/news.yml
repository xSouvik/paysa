# Collects news every 6 hours and publishes it. If an official PIB release announces a new DA,
# it opens a pull request for you to approve. Rates never change without your approval.
name: Update news

on:
  schedule:
    - cron: '15 0,6,12,18 * * *'   # 05:45, 11:45, 17:45, 23:45 IST
  workflow_dispatch:                # "Run workflow" button for a manual refresh

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect news
        run: node scripts/fetch-news.mjs

      - name: Check data files
        run: node scripts/validate-data.mjs

      - name: Publish news
        id: publish
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No new stories."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "paysa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "News update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Propose DA change for approval
        if: hashFiles('.paysa/da-proposal.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "paysa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/propose-da.mjs

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
