# Collects news every 6 hours and publishes it. If an official PIB release announces a new DA,
# it opens a pull request for you to approve. Rates never change without your approval.
name: Update news

on:
  schedule:
    - cron: '15 0,6,12,18 * * *'   # 05:45, 11:45, 17:45, 23:45 IST
  workflow_dispatch:                # "Run workflow" button for a manual refresh

# A newer run replaces one that is stuck, so the robot can never freeze for days.
concurrency:
  group: news
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write               # to start the separate "Deploy app" workflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Collect news
        run: node scripts/fetch-news.mjs

      - name: Check data files
        run: node scripts/validate-data.mjs

      - name: Publish news
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No new stories."
            exit 0
          fi
          git config user.name "paysa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "News update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
          # Deploy runs on its own, so a slow or stuck deploy can't hold up the next news run
          gh workflow run deploy.yml --ref main

      - name: Propose DA change for approval
        if: hashFiles('.paysa/da-proposal.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "paysa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/propose-da.mjs
